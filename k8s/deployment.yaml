apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-capstone-deployment
  labels:
    app: dealership-capstone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dealership-capstone
  template:
    metadata:
      labels:
        app: dealership-capstone
    spec:
      containers:
        - name: dealership-app
          image: dealership-capstone:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DEBUG
              value: "False"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dealership-secrets
                  key: SECRET_KEY
            - name: ALLOWED_HOSTS
              value: "*"
          livenessProbe:
            httpGet:
              path: /api/dealers/
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/dealers/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: dealership-capstone-service
  labels:
    app: dealership-capstone
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: dealership-capstone
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dealership-capstone-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dealership-capstone-service
                port:
                  number: 80
